<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WOZ-DOS // 1975 RETRO KERNEL & SHELL</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=VT323&display=swap');

  * { box-sizing: border-box; user-select: none; }

  body {
    background-color: #0b0f0b;
    color: #00ff66;
    font-family: 'VT323', monospace;
    margin: 0;
    padding: 20px;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    overflow: hidden;
  }

  .desktop {
    background: #182018;
    border: 4px solid #283828;
    border-radius: 12px;
    width: 100%;
    max-width: 960px;
    height: 620px;
    display: flex;
    flex-direction: column;
    box-shadow: 0 10px 40px rgba(0,255,102,0.15);
  }

  .header-bar {
    background: #283828;
    color: #00ff66;
    padding: 8px 16px;
    font-size: 20px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-bottom: 2px solid #385038;
  }

  .terminal-screen {
    flex: 1;
    background-color: #050805;
    padding: 20px;
    overflow-y: auto;
    font-size: 22px;
    line-height: 1.3;
    position: relative;
    box-shadow: inset 0 0 30px rgba(0,255,102,0.1);
  }

  /* CRT Scanlines */
  .terminal-screen::before {
    content: " ";
    display: block;
    position: absolute;
    top: 0; left: 0; bottom: 0; right: 0;
    background: linear-gradient(rgba(18,16,16,0) 50%, rgba(0,0,0,0.25) 50%);
    background-size: 100% 4px;
    z-index: 5;
    pointer-events: none;
  }

  .line { white-space: pre-wrap; word-break: break-all; margin: 0; }

  .input-row {
    display: flex;
    align-items: center;
    margin-top: 4px;
  }

  .prompt { margin-right: 6px; color: #00ff66; }

  #cli-input {
    background: transparent;
    border: none;
    color: #00ff66;
    font-family: 'VT323', monospace;
    font-size: 22px;
    outline: none;
    width: 100%;
    caret-color: transparent;
  }

  .cursor {
    display: inline-block;
    width: 10px;
    height: 20px;
    background-color: #00ff66;
    animation: blink 0.8s infinite;
    vertical-align: middle;
    margin-left: 2px;
  }

  @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }

  .taskbar {
    background: #111811;
    padding: 10px 16px;
    display: flex;
    gap: 12px;
    border-top: 2px solid #283828;
  }

  button.sys-btn {
    background: #283828;
    color: #00ff66;
    border: 1px solid #385038;
    padding: 6px 14px;
    font-family: 'VT323', monospace;
    font-size: 18px;
    cursor: pointer;
    border-radius: 4px;
  }
  button.sys-btn:hover { background: #385038; }
</style>
</head>
<body>

<div class="desktop">
  <div class="header-bar">
    <span>WOZ-DOS v1.0 (PRE-APPLE KERNEL - 1975)</span>
    <span id="clock">00:00:00</span>
  </div>
  
  <div class="terminal-screen" id="screen" onclick="document.getElementById('cli-input').focus()">
    <div id="output"></div>
    <div class="input-row">
      <span class="prompt" id="prompt-label">A:\&gt;</span>
      <span id="typed"></span><span class="cursor"></span>
      <input type="text" id="cli-input" autocomplete="off" spellcheck="false" autofocus>
    </div>
  </div>

  <div class="taskbar">
    <button class="sys-btn" onclick="runCommand('HELP')">HIZLI YARDIM (?) APPROACH</button>
    <button class="sys-btn" onclick="runCommand('DIR')">DOSYALAR (DIR)</button>
    <button class="sys-btn" onclick="runCommand('GITHUB')">GITHUB REPO</button>
    <button class="sys-btn" onclick="runCommand('CLS')">TEMIZLE</button>
  </div>
</div>

<script>
  // Sanal Dosya Sistemi (In-Memory File System)
  const fileSystem = {
    "README.TXT": "WOZ-DOS 1975 Prototip Sistemine Hos Geldiniz.\nBu sistem Apple I oncesi doneme ait minimalist komut seti sunar.\n",
    "APPLE.CFG": "KERNEL_TYPE=WOZ_MONITOR\nCPU=MOS_6502_EMULATOR\nMEMORY=4KB_RAM\nSTATUS=EXPERIMENTAL\n",
    "NOTE.TXT": "GitHub uzerinden yayinlamak icin index.html dosyasini repoya ekleyin."
  };

  const outputEl = document.getElementById('output');
  const inputEl = document.getElementById('cli-input');
  const typedEl = document.getElementById('typed');
  const screenEl = document.getElementById('screen');

  function print(text = "") {
    const div = document.createElement('div');
    div.className = 'line';
    div.textContent = text;
    outputEl.appendChild(div);
    screenEl.scrollTop = screenEl.scrollHeight;
  }

  function boot() {
    print("==================================================");
    print("  WOZ-DOS KERNEL INITIALIZATION (OCTOBER 1975)    ");
    print("  MOS 6502 MICROPROCESSOR SIMULATION ENGINE       ");
    print("==================================================");
    print("Sistem Bellegi: 4096 Bayt OK.");
    print("Dosya Sistemi: Aktif. Yardim icin 'HELP' yazin.");
    print("");
  }

  function runCommand(cmdStr) {
    const raw = cmdStr.trim();
    print("A:\\>" + raw);
    const parts = raw.split(" ");
    const cmd = parts[0].toUpperCase();
    const arg1 = parts[1] || "";
    const arg2 = parts.slice(2).join(" ");

    if (cmd === "HELP" || cmd === "?") {
      print("Mevcut Komutlar:");
      print("  DIR              - Tum dosyalari listeler");
      print("  TYPE <dosya>     - Belge icerigini gosterir");
      print("  EDIT <dosya> <metn> - Yeni belge olusturur veya duzenler");
      print("  DEL <dosya>      - Dosya siler");
      print("  GITHUB           - GitHub deposu baglantisini ve rehberini gosterir");
      print("  CLS              - Ekrani temizler");
      print("  VER              - Sistem surum bilgisini gosterir");
    } else if (cmd === "DIR") {
      print("Dizin: A:\\");
      let count = 0;
      let totalBytes = 0;
      for (let f in fileSystem) {
        print(`  ${f.padEnd(12)} ${fileSystem[f].length} BYTES`);
        count++;
        totalBytes += fileSystem[f].length;
      }
      print(`  Toplam ${count} dosya, ${totalBytes} bayt kullaniliyor.`);
    } else if (cmd === "TYPE") {
      if (!arg1) {
        print("HATA: Dosya adi belirtilmedi. (Ornek: TYPE README.TXT)");
      } else if (fileSystem[arg1.toUpperCase()]) {
        print("--- " + arg1.toUpperCase() + " ---");
        print(fileSystem[arg1.toUpperCase()]);
      } else {
        print("HATA: Dosya bulunamadi!");
      }
    } else if (cmd === "EDIT") {
      if (!arg1) {
        print("HATA Kullanim: EDIT <DOSYA_ADI> <METIN>");
      } else {
        const fname = arg1.toUpperCase();
        const content = arg2 || "Bos Belge";
        fileSystem[fname] = content + "\n";
        print(`BASARILI: '${fname}' olusturuldu / guncellendi.`);
      }
    } else if (cmd === "DEL") {
      if (fileSystem[arg1.toUpperCase()]) {
        delete fileSystem[arg1.toUpperCase()];
        print(`DOSYA SILINDI: ${arg1.toUpperCase()}`);
      } else {
        print("HATA: Boyle bir dosya yok.");
      }
    } else if (cmd === "GITHUB") {
      print("=== GITHUB DEPO YAYINLAMA REHBERI ===");
      print("1. GitHub'da yeni bir public repository olusturun.");
      print("2. Bu kodu 'index.html' adiyla commit'leyin.");
      print("3. Settings > Pages menusunden 'main' dalini secip aktif edin.");
      print("Deponuz Apple oncesi tum retro kodlarinizla yayina hazirdir!");
    } else if (cmd === "CLS") {
      outputEl.innerHTML = "";
    } else if (cmd === "VER") {
      print("WOZ-DOS Kernel 0.95 (Pre-Apple Homebrew Edition)");
    } else if (raw !== "") {
      print(`HATA: Taninmayan komut '${raw}'. Yardim icin 'HELP' yazin.`);
    }
    print("");
  }

  inputEl.addEventListener('input', () => {
    typedEl.textContent = inputEl.value;
  });

  inputEl.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') {
      const val = inputEl.value;
      inputEl.value = '';
      typedEl.textContent = '';
      runCommand(val);
    }
  });

  setInterval(() => {
    const d = new Date();
    document.getElementById('clock').textContent = d.toTimeString().split(' ')[0];
  }, 1000);

  boot();
</script>
</body>
</html>
